# Render Blueprint for TRACE: one free web service that serves the API and the website.
# The service keeps its original infrastructure name (renaming would create a new service and URL).
# Render sets PORT automatically; the app reads it.
services:
  - type: web
    name: nexus-resilience
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Only needed if you also host the front end separately (e.g. on Vercel). Comma-separated origins.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: MAX_REQUEST_BYTES
        value: "2097152"
      # Secrets: set the values in the Render dashboard (never in this file).
      - key: TRACE_INGEST_TOKEN
        sync: false
      - key: TRACE_VIEW_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
