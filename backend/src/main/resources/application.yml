server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 2048
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

spring:
  application:
    name: trace-api
  main:
    banner-mode: off
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    default-property-inclusion: always

trace:
  # Comma-separated browser origins allowed to call the API, e.g. https://trace-ui.example
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  max-request-bytes: ${MAX_REQUEST_BYTES:2097152}
  max-area-segments: ${MAX_AREA_SEGMENTS:20000}
  max-flow-segments: ${MAX_FLOW_SEGMENTS:6000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
